behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin" 
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      translational_acc_lim: 0.5
      max_translational_vel: 0.5
      min_translational_vel: 0.1 
    wait:
      plugin: "nav2_behaviors/Wait" 
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    transform_timeout: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.02
    rotational_acc_lim: 1.0
    max_translational_vel: 1.0
    min_translational_vel: 0.1
    translational_acc_lim: 1.0
    enable_stamped_cmd_vel: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    bt_loop_duration: 50 # 20 Hz
    goal_reached_velocity_threshold: 0.15
    transform_tolerance: 0.1
    # default_nav_to_pose_bt_xml: nav_to_pose_bt.xml 
    # default_nav_through_poses_bt_xml: nav_through_poses_bt.xml 
    # always_reload_bt_xml: false
    # goal_blackboard_id: goal
    # goals_blackboard_id: goals
    # path_blackboard_id: path
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator" 
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator" 
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"]
    # goal_checker_plugins: ["goal_checker"]
    # current_goal_checker: "goal_checker"
    goal_checker_plugins: ["stopped_goal_checker"]
    current_goal_checker: "stopped_goal_checker"
    controller_plugins: ["FollowPath"]
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10   
      movement_time_allowance: 30.0
    
    # goal_checker:
    #   plugin: "nav2_controller::SimpleGoalChecker"
    #   stateful: false
    #   stop_on_goal: true
    #   xy_goal_tolerance: 0.20   # m #0.10
    #   yaw_goal_tolerance: 0.20  # radians #0.08 
    
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      stop_on_goal: true
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 0.20
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.15
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      stateful: true
      holonomic_robot: true

      min_vel_x: -0.6
      min_vel_y: -0.6        
      max_vel_x: 0.6          
      max_vel_y: 0.6         
      max_vel_theta: 2.0
      min_vel_theta: 0.01

      min_speed_xy: 0.05
      max_speed_xy: 0.6
      max_speed_theta: 1.5
      min_speed_theta: 0.02

      acc_lim_x: 0.7
      acc_lim_y: 0.7          
      acc_lim_theta: 6.0    
      
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -6.0

      vx_samples: 15
      vy_samples: 15          
      vtheta_samples: 20

      sim_time: 2.0  
      time_granularity: 0.05  
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2 

      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.18

      short_circuit_trajectory_evaluation: True

      critics: [
        "BaseObstacle",
        "Oscillation",
        "PathAlign",
        "PathDist",
        "GoalDist",
        "GoalAlign",
        "RotateToGoal",
      ]
      BaseObstacle.scale: 0.4

      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.3

      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.3

      PathDist.scale: 10.0
      GoalDist.scale: 8.0

      RotateToGoal.scale: 15.0
      RotateToGoal.slowing_factor: 1.5
      RotateToGoal.lookahead_time: 0.8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0   # increased for faster dynamic obstacle updates
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[ [0.38, 0.28], [-0.38, 0.28], [-0.38, -0.28], [0.38, -0.28] ]" # "[ [0.42, 0.34], [-0.42, 0.34], [-0.42, -0.34], [0.42, -0.34] ]"  # added safety margin
      always_send_full_costmap: true
      plugins: ["static_layer", "voxel_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /merged
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0   # reduced for faster dynamic response
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /merged
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0   # reduced for dynamic obstacles
          raytrace_min_range: 0.2
          obstacle_max_range: 3.0   # reduced for dynamic obstacles
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.36

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: false

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      minimum_turning_radius: 0.60  # Increased from 0.50 for even better clearance
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.0
      cost_penalty: 5.0  # Increased from 3.5 to strongly avoid high-cost areas
      retrospective_penalty: 0.0
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      track_unknown_space: false
      rolling_window: false
      resolution: 0.05
      footprint: "[ [0.38, 0.28], [-0.38, 0.28], [-0.38, -0.28], [0.38, -0.28] ]" #"[ [0.42, 0.34], [-0.42, 0.34], [-0.42, -0.34], [0.42, -0.34] ]"
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /merged
          max_obstacle_height: 2.0
          marking: True
          clearing: True
          data_type: "LaserScan"
          raytrace_max_range: 4.8
          raytrace_min_range: 0.2
          obstacle_max_range: 4.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.6, 1.2]
    min_velocity: [-0.5, -0.5, -1.2]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [0.7, 0.7, 6.0]
    max_decel: [-0.7, -0.7, -6.0]
    odom_topic: "odom"
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: false