dual_laser_merger:
  ros__parameters:
    # INPUT TOPICS
    laser_1_topic: /front_scan
    laser_2_topic: /rear_scan
    
    # OUTPUT TOPIC
    merged_topic: /merged
    
    target_frame: base_link
    
    # TIMING
    publish_rate: 50 
    
    # GEOMETRY
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.005
    min_height: -0.2
    max_height: 0.2
    
    range_min: 0.02
    range_max: 20.0
    use_inf: true