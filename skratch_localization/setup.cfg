[develop]
script_dir=$base/lib/skratch_localization
[install]
install_scripts=$base/lib/skratch_localization

[flake8]
# Set line length to 100 (standard in ROS 2 is often 100 or 88, default is 79)
max-line-length = 100
# Ignore common annoying errors:
# W503: Line break before binary operator
# E203: Whitespace before ':'
extend-ignore = W503, E203
# Exclude auto-generated folders
exclude = 
    test,
    setup.py,
    build,
    install,
    dist

[pydocstyle]
# Check for docstrings (PEP257)
# D100: Missing docstring in public module
# D101: Missing docstring in public class
# D102: Missing docstring in public method
# D103: Missing docstring in public function
ignore = D100, D101, D102, D103